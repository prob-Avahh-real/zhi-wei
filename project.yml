name: 知味
options:
  bundleIdPrefix: com.zhiwei
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  SWIFT_VERSION: "5.9"

targets:
  知味:
    type: application
    platform: [iOS, macOS]
    sources:
      - Sources/ZhiWei
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zhiwei.app
      INFOPLIST_FILE: Info.plist

  知味Tests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - Tests/ZhiWeiTests
    dependencies:
      - target: 知味
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zhiwei.tests
